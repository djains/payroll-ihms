workflows:
  react-native-ios:
    name: NG Global iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS Simulator App for Appetize
        script: |
          cd ios
          xcodebuild build \
            -workspace IH.xcworkspace \
            -scheme IH \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          # Locate the actual compiled IH.app
          APP_PATH=$(find derived_data -name "IH.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: IH.app was not found!"
            exit 1
          fi
          
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          zip -r -X "$CM_BUILD_DIR/NG_Global_Appetize.zip" IH.app
          ls -lh "$CM_BUILD_DIR/NG_Global_Appetize.zip"
    artifacts:
      - "*.zip"
    publishing:
      email:
        recipients:
          - djain@coreal.in
        notify:
          failure: true
          success: true
