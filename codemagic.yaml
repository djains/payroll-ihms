workflows:
  react-native-ios:
    name: NG Global iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS Simulator App for Appetize
        script: |
          cd ios
          xcodebuild build \
            -workspace IH.xcworkspace \
            -scheme IH \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=../build/ios
          
          cd ../build/ios/Release-iphonesimulator
          # Directly zip the .app folder so Appetize finds Info.plist right at the root
          zip -r -X NG_Global_Simulator.zip IH.app
    artifacts:
      - build/ios/Release-iphonesimulator/*.zip
      - build/ios/Release-iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - djain@coreal.in
        notify:
          failure: true
          success: true
