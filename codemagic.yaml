workflows:
  react-native-ios:
    name: NG Global iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS App (.app / unsigned IPA)
        script: |
          cd ios
          xcodebuild build \
            -workspace IH.xcworkspace \
            -scheme IH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=../build/ios
          
          cd ..
          mkdir -p build/ios/Payload
          cp -R build/ios/Release-iphoneos/IH.app build/ios/Payload/
          cd build/ios
          zip -r NG_Global_unsigned.ipa Payload
    artifacts:
      - build/ios/*.ipa
      - build/ios/Release-iphoneos/*.app
    publishing:
      email:
        recipients:
          - djain@coreal.in
        notify:
          failure: true
          success: true
