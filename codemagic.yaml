workflows:
  react-native-ios:
    name: NG Global iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/IH.xcworkspace" \
            --scheme "IH"
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/*/*.app
    publishing:
      email:
        recipients:
          - djain@coreal.in
        notify:
          failure: true
          success: true
